{{ define "main" }}
    <div class="links-page">
        <h1 class="section-title">{{ .Title }}</h1>
        <div class="links-content article-content">
            {{ .Content }}
        </div>

        <div class="links-grid">
            {{ range .Site.Data.links.links }}
                <a class="link-card" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
                    <span class="link-avatar" style="--link-hue: {{ default 160 .hue }}">{{ printf "%.1s" .name }}</span>
                    <span class="link-info">
                        <strong>{{ .name }}</strong>
                        <em>{{ .desc }}</em>
                    </span>
                </a>
            {{ end }}
        </div>
    </div>
{{ end }}
