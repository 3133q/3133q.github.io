mainSections   = ["post"]
rssFullContent = true
favicon        = "/img/avatar.png"

[hero]
    enabled       = true
    background   = "image"
    image        = "/img/hero.jpg"
    homePageFull = false

[footer]
    since = 2026
    customText = "Built with Hugo · Theme Stack"

[sidebar]
    emoji    = "🛡️"
    subtitle = "CTF 萌新 · PWN 方向修行中"
    avatar   = "/img/avatar.png"

[article]
    math = true
    readingTime = true
    [article.license]
        enabled = true
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [
        { type = "toc" },
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]

[comments]
    enabled = true
    provider = "giscus"

    # 部署后操作：
    # 1. GitHub 仓库设为 public，并开启 Discussions（Settings -> General -> Features）
    # 2. 安装 giscus App: https://github.com/apps/giscus
    # 3. 到 https://giscus.app/zh-CN 生成 repoID / categoryID 填到下面
    [comments.giscus]
        repo             = "3133q/3133q.github.io"
        repoID           = "R_kgDOUGx3aA"
        category         = "Announcements"
        categoryID       = "DIC_kwDOUGx3aM4DEXGy"
        mapping          = "pathname"
        lightTheme       = "light"
        darkTheme        = "dark_dimmed"
        reactionsEnabled = 1
        emitMetadata     = 0
        inputPosition    = "bottom"
        lang             = "zh-CN"
        strict           = 0
        loading          = "lazy"

[opengraph]
    [opengraph.twitter]
        site = ""
        card = "summary_large_image"

[colorScheme]
    toggle = true
    default = "auto"
